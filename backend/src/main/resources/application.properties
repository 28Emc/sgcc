# Application
spring.application.name=sgcc-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sgcc
spring.datasource.username=sgcc_user
spring.datasource.password=sgcc_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.com.sgcc=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
