services:
  postgres:
    image: postgres:16-alpine
    container_name: sgcc-postgres
    environment:
      POSTGRES_DB: sgcc
      POSTGRES_USER: sgcc_user
      POSTGRES_PASSWORD: sgcc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgcc_user -d sgcc"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgcc-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sgcc
      SPRING_DATASOURCE_USERNAME: sgcc_user
      SPRING_DATASOURCE_PASSWORD: sgcc_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgcc-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
